# SPDX-License-Identifier: MPL-2.0
name: Scorecards supply-chain security

on:
  push:
    branches: [main, master]
  # The reusable's pull-request job measures the repo-level Scorecard checks at
  # HEAD and merges them into the PR-tree SARIF, so the code_scanning rule sees
  # all three supply-chain categories instead of waiting forever on two that a
  # pull_request event can never produce. Without this trigger that job — which
  # already exists in the reusable — never fires.
  pull_request:
    branches: [main, master]
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'

# The called reusable's scorecard job requests security-events:write +
# id-token:write at job level. read-all cannot cover write scopes and a
# called workflow can only narrow the caller's token — so every run was
# a startup_failure. Grant exactly the superset the callee needs.
permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

jobs:
  analysis:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540 # newest lockfile-consistent standards commit, 2026-09-10
    secrets: inherit
